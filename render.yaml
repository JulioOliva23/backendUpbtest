services:
  - type: web
    name: backendupbtest-julio
    runtime: node
    repo: https://github.com/JulioOliva23/backendUpbtest.git
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: PORT
        value: 10000
      - key: DB_SSL
        value: true
      - key: DATABASE_URL
        sync: false # <-- se llena en el dashboard de Render con la Internal Database URL
